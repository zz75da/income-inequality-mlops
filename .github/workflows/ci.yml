name: CI — Tests & DVC Sync

on:
  push:
    branches: [main, master, "experiment/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    name: Lint, Format & Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        run: mypy

  security:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: |
          pip-audit -r requirements.txt || true
          pip-audit -r train-api/requirements.txt || true
          pip-audit -r predict-api/requirements.txt || true
          pip-audit -r streamlit/requirements.txt || true
        # Non-blocking for now (|| true): surfaces findings in the log without
        # failing the whole pipeline on a transitive CVE with no fix available
        # yet. Tighten to a hard failure once the baseline is clean.

  tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    permissions:
      checks: write
      contents: read

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "fastapi==0.111.0" \
            "uvicorn[standard]==0.30.1" \
            "pydantic==2.7.4" \
            "requests==2.32.3" \
            "httpx>=0.27.0" \
            "prometheus-client==0.21.0" \
            "prometheus-fastapi-instrumentator==6.1.0" \
            "pandas==2.2.2" \
            "numpy==1.26.4" \
            "scikit-learn==1.4.2" \
            "xgboost==2.0.3" \
            "pyyaml==6.0.1" \
            "pycountry==24.6.1" \
            "pandera==0.19.3" \
            "shap==0.46.0"

      - name: Install test dependencies
        run: pip install -r tests/requirements-test.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short -q --junitxml=tests/logs/unit-results.xml

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short -q -m integration --junitxml=tests/logs/integration-results.xml

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Pytest Results
          path: tests/logs/*-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: tests/logs/
          if-no-files-found: ignore

  dvc-sync:
    name: DVC Status Check
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install DVC
        run: pip install "dvc[s3]"

      - name: DVC pull (verify remote is reachable and in sync)
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote modify origin --local access_key_id "$DAGSHUB_TOKEN"
          dvc remote modify origin --local secret_access_key "$DAGSHUB_TOKEN"
          dvc status --cloud || echo "DVC remote not configured yet — skipping (set DAGSHUB_USER/DAGSHUB_TOKEN repo secrets to enable)"
