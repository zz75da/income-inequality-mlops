global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "train-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["train-api:5002"]

  - job_name: "predict-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["predict-api:5003"]

  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
