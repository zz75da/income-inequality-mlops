route:
  receiver: default
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    # Wire up an email or webhook receiver here — left as a no-op by default
    # so the stack runs out of the box without credentials. Example email
    # config (uncomment and fill in via env substitution or a templated file
    # like rakuten_mlops_services/monitoring/alertmanager.yml.tmpl):
    #
    # email_configs:
    #   - to: "you@example.com"
    #     from: "alertmanager@example.com"
    #     smarthost: "smtp.gmail.com:587"
    #     auth_username: "you@gmail.com"
    #     auth_password: "app_password"
