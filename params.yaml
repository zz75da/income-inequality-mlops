# =============================================================================
# Income Inequality MLOps — Experiment Parameters
# =============================================================================
# Edit this file to run a new experiment. The DVC pipeline and train-api read
# it at training time; MLflow logs every value automatically so each run is
# one comparable experiment point in DagsHub -> Experiments.
# =============================================================================

data:
  start_year: 1990
  end_year: 2024
  # Countries excluded for lack of reliable coverage across all 4 sources
  min_years_required: 5   # a country needs >= N years of data to be kept after merge

features:
  # Macro features assembled from World Bank + OECD + Eurostat + WID
  numeric_features:
    - gdp_per_capita_ppp
    - gdp_growth_pct
    - unemployment_rate
    - education_expenditure_pct_gdp
    - social_spending_pct_gdp
    - tax_revenue_pct_gdp
    - urban_population_pct
    - population_total
    - top10_income_share      # WID
    - bottom50_income_share   # WID
  categorical_features:
    - region
    - income_group_lag1       # previous year's WB income group, as a feature (not the classification target)
  target_gini: gini_index                    # World Bank / OECD SI.POV.GINI, regression
  target_mobility: intergen_income_elasticity # WID/GDIM-derived, regression
  target_mobility_rank: intergen_rank_correlation # GDIM's rank-correlation mobility measure, regression
  target_income_group: income_group           # World Bank classification (L / LM / UM / H), classification

split:
  test_size: 0.2
  random_seed: 42
  # Grouped split by country so the same country never leaks between train/test
  group_column: country_code

model_gini:
  algorithm: xgboost_regressor
  n_estimators: 400
  max_depth: 5
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0

model_mobility:
  algorithm: random_forest_regressor
  n_estimators: 500
  max_depth: 8
  min_samples_leaf: 3

model_mobility_rank:
  algorithm: random_forest_regressor
  n_estimators: 500
  max_depth: 8
  min_samples_leaf: 3

model_income_group:
  algorithm: xgboost_classifier
  n_estimators: 300
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8

train:
  cv_folds: 5
  early_stopping_rounds: 30

# MLflow model registry promotion gates — a training run only gets promoted
# to the "Production" registry stage if its metric clears the bar here;
# otherwise it stays in "Staging" (still logged, just not live). gini and
# income_group mirror monitoring/alert-rules.yml's existing GiniModelR2Low /
# IncomeGroupAccuracyLow thresholds exactly — keep both in sync by hand if
# you change either (Prometheus rule files can't read this YAML directly).
promotion_gates:
  gini:
    metric: r2
    min: 0.4
  mobility:
    metric: r2
    min: 0.15
  mobility_rank:
    metric: r2
    min: 0.15
  income_group:
    metric: accuracy
    min: 0.7

monitoring:
  # Low enough that a portfolio demo's organic traffic can realistically
  # reach it (100 was effectively unreachable without deliberately curling
  # predict-api 100 times — a recruiter clicking through the Predict page
  # would never see a drift report auto-generate). The Streamlit Drift
  # Reports page also has a manual "Trigger now" button for immediate
  # demonstration regardless of buffer size.
  drift_reference_min_rows: 20
  drift_psi_threshold: 0.2   # population stability index alert threshold per feature
